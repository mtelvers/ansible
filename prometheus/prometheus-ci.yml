# my global config
global:
  scrape_interval:     30s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 30s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
    - targets: ['localhost:9090']

  - job_name: 'ocaml-ci'
    static_configs:
    - targets: ['ci:8080']
 
  - job_name: 'ocaml-ci-gitlab'
    static_configs:
    - targets: ['gitlab:8080']

  - job_name: 'ocaml-ci-web'
    static_configs:
    - targets: ['web:9090']

  - job_name: 'opam-repo-ci'
    scheme: https
    basic_auth:
      username: prometheus
      password: {{ prometheus_password_plain }}
    static_configs:
    - targets: ['opam-repo.ci.ocaml.org']

  - job_name: 'opam.ci.ocaml.org'
    scheme: https
    basic_auth:
      username: prometheus
      password: {{ prometheus_password_plain }}
    metrics_path: '/host/metrics'
    static_configs:
    - targets: ['opam-repo.ci.ocaml.org']

  - job_name: 'staging.ocaml.org'
    scheme: https
    basic_auth:
      username: prometheus
      password: {{ prometheus_password_plain }}
    metrics_path: '/host/metrics'
    static_configs:
    - targets: ['staging.ocaml.org']

  - job_name: 'www.ocaml.org'
    scheme: https
    basic_auth:
      username: prometheus
      password: {{ prometheus_password_plain }}
    metrics_path: '/host/metrics'
    static_configs:
    - targets: ['www.ocaml.org']

  - job_name: 'winter'
    basic_auth:
      username: sandmark
      password: s4ndm4rk
    scheme: 'https'
    tls_config:
       insecure_skip_verify: true
    static_configs:
    - targets: ['winter.ocamllabs.io:9100']

  - job_name: 'navajo'
    basic_auth:
      username: sandmark
      password: s4ndm4rk
