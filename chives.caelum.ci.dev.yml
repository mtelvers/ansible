---

- hosts: ocaml.ci.dev
  name: Set up Docker
  roles:
    - docker
    - deployer-key

- hosts: ocaml.ci.dev
  name: Set up SwarmKit
  tasks:
    - docker_swarm:
        listen_addr: "127.0.0.1:2377"
        advertise_addr: "127.0.0.1:2377"

- hosts: ocaml.ci.dev
  tasks:
    - name: copy Docker secrets
      docker_secret:
        name: "{{ item }}"
        data: "{{ lookup('vars', item) | b64encode }}"
        data_is_b64: true
      loop:
        - ocaml-ci-github-key
        - ocaml-ci-oauth
        - ocaml-ci-submission-cap
        - ocaml-ci-webhook-secret
        - ocaml-ci-gitlab-oauth
        - ocaml-ci-gitlab-token
        - ocaml-ci-gitlab-webhook-secret
        - ocaml-ci-solver-cap
        - opam-repo-ci-submission-cap
        - opam-repo-ci-webhook-secret
        - opam-repo-ci-github-key
        - opam-repo-ci-oauth
        - mirage-ci-github-token
        - mirage-ci-submission-cap
        - mirage-ci-webhook-secret
        - mirage-deployer-github-key
        - mirage-deployer-github-oauth
        - mirage-deployer-slack
        - mirage-deployer-ssh-key
        - mirage-deployer-submission-cap
        - mirage-deployer-webhook-secret
        - ocurrentbuilder-password
        - ocurrent-hub
        - base-builder-oauth
        - base-builder-slack
        - base-builder-submission-cap
        - tarides-deployer-github-key
        - tarides-deployer-github-oauth
        - tarides-deployer-slack
        - tarides-deployer-ssh-key
        - tarides-deployer-submission-cap
        - tarides-deployer-webhook-secret
    - name: create caddy directory
      file:
        path: /etc/caddy
        state: directory
    - name: configure caddy
      template:
        src: caddy/chives.caelum.ci.dev
        dest: /etc/caddy/Caddyfile
      notify:
        - restart caddy
    - name: install clear log script
      template:
        src: cron-scripts/clear-log
        dest: /etc/cron.hourly/clear-log
        mode: u=rwx,g=rx,o=rx
      vars:
        volumes:
          - ocaml-ci_data
          - opam-repo-ci_data
          - mirage-ci_data
    - name: install docker-prune script
      copy:
        src: cron-scripts/docker-prune
        dest: /etc/cron.daily/docker-prune
        mode: u=rwx,g=rx,o=rx
    - name: create prometheus directory
      file:
        path: /etc/prometheus
        state: directory
    - name: Configure Prometheus Monitoring
      template:
        src: prometheus/prometheus-ci.yml
        dest: /etc/prometheus/prometheus.yml
      notify:
        - restart prometheus
    - name: Set up infrastructure stack
      docker_stack:
        name: infra
        prune: yes
        compose:
          - version: "3.7"
            services:
              caddy:
                image: caddy
                deploy:
                  mode: global
                ports:
                  - target: 80
                    published: 80
                    protocol: tcp
                    mode: host
                  - target: 443
                    published: 443
                    protocol: tcp
                    mode: host
                  - target: 8100
                    published: 8100
                    protocol: tcp
                    mode: host
                  - target: 8200
                    published: 8200
                    protocol: tcp
                    mode: host
                networks:
                  opam-repo-ci_default: {}
                  ocaml-ci_default: {}
                  default: {}
                volumes:
                  - /etc/caddy:/etc/caddy:ro
                  - caddy_data:/data
                  - caddy_config:/config
              prometheus:
                image: prom/prometheus
                command: --storage.tsdb.retention.time=30w --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.console.libraries=/usr/share/prometheus/console_libraries --web.console.templates=/usr/share/prometheus/consoles
                volumes:
                  - "prometheus-data:/prometheus"
                  - "/etc/prometheus:/etc/prometheus:ro"
                networks:
                  opam-repo-ci_default: {}
                  ocaml-ci_default: {}
                  default: {}
              grafana:
                image: grafana/grafana
                volumes:
                  - "grafana-storage:/var/lib/grafana"
                environment:
                  - "GF_SERVER_ROOT_URL=http://status.ocaml.ci.dev"
              mirage-ci:
                image: ocurrent/mirage-ci:live
                command: --ocluster-cap /run/secrets/mirage-ci-submission-cap --github-webhook-secret-file /run/secrets/mirage-ci-webhook-secret --github-token-file /run/secrets/mirage-ci-github-token --test-mirage-4 mirage,skeleton,dev,overlay
                volumes:
                  - 'mirage-ci_data:/var/lib/ocurrent'
                secrets:
                  - mirage-ci-github-token
                  - mirage-ci-submission-cap
                  - mirage-ci-webhook-secret
                sysctls:
                  - 'net.ipv4.tcp_keepalive_time=60'
                environment:
                  - "CI_PROFILE=production"
              mirage-deployer:
                image: ocurrent/deploy.mirageos.org:live
                command: --github-app-id 54383 --github-private-key-file /run/secrets/mirage-deployer-github-key --github-account-allowlist mirage --slack /run/secrets/mirage-deployer-slack --confirm above-average --confirm-auto-release 120 --github-oauth /run/secrets/mirage-deployer-github-oauth --github-webhook-secret-file /run/secrets/mirage-deployer-webhook-secret --submission-service /run/secrets/mirage-deployer-submission-cap --staging-password-file /run/secrets/ocurrentbuilder-password -v --flavour mirage
                volumes:
                  - 'mirage-deployer-data:/var/lib/ocurrent'
                  - 'mirage-deployer-ssh:/root/.ssh'
                secrets:
                  - mirage-deployer-github-key
                  - mirage-deployer-github-oauth
                  - mirage-deployer-slack
                  - mirage-deployer-webhook-secret
                  - mirage-deployer-submission-cap
                  - ocurrent-hub
                  - ocurrentbuilder-password
                  - source: 'mirage-deployer-ssh-key'
                    target: 'deployer-ssh-key'
                    mode: 0400
                sysctls:
                  - 'net.ipv4.tcp_keepalive_time=60'
              scheduler:
                image: ocurrent/ocluster-scheduler:live
                command: --secrets-dir /capnp-secrets --capnp-secret-key-file /capnp-secrets/key.pem --capnp-listen-address tcp:0.0.0.0:9000 --capnp-public-address=tcp:scheduler.ci.dev:8103 --pools=linux-x86_64,linux-arm64,linux-ppc64,linux-riscv64,linux-s390x,freebsd-x86_64,macos-x86_64,macos-arm64,windows-1809-x86_64,windows-x86_64,windows-amd64,openbsd-amd64,solver,solver-test,test,docs-pipeline --listen-prometheus=9090 --state-dir=/var/lib/ocluster-scheduler -v
                init: true
                ports:
                  - '8103:9000'
                volumes:
                  - 'scheduler-data:/var/lib/ocluster-scheduler'
                  - 'scheduler-capnp-secrets:/capnp-secrets'
                sysctls:
                  - 'net.ipv4.tcp_keepalive_time=60'
              base-images:
                image: ocurrent/base-images:live
                command: --confirm above-average --confirm-auto-release 120 --verbose --slack /run/secrets/base-builder-slack --capnp-address=images.ci.ocaml.org:8101 --github-oauth /run/secrets/base-builder-oauth --submission-service /run/secrets/base-builder-submission-cap --staging-password-file /run/secrets/ocurrentbuilder-password
                init: true
                ports:
                  - '8101:9000'
                environment:
                  DOCKER_BUILDKIT: 0
                  DEPLOYMENT: 1
                volumes:
                  - 'base-images-data:/var/lib/ocurrent'
                  - 'base-images-capnp-secrets:/capnp-secrets'
                secrets:
                  - base-builder-oauth
                  - base-builder-slack
                  - base-builder-submission-cap
                  - ocurrentbuilder-password
                  - ocurrent-hub
                sysctls:
                  - 'net.ipv4.tcp_keepalive_time=60'
              sandmark:
                image: ocurrent/sandmark-nightly:live
                sysctls:
                  - 'net.ipv4.tcp_keepalive_time=60'
              tarides-deployer:
                image: ocurrent/ci.ocamllabs.io-deployer:live-ci3
                command: -v --github-app-id 85548 --github-private-key-file /run/secrets/deployer-github-key --github-account-allowlist ocurrent,mirage,ocaml-bench,ocaml,tarides --slack /run/secrets/deployer-slack --confirm above-average --confirm-auto-release 120 --github-oauth /run/secrets/deployer-github-oauth --github-webhook-secret-file /run/secrets/deployer-webhook-secret --submission-service /run/secrets/deployer-submission-cap --staging-password-file /run/secrets/ocurrentbuilder-password --flavour tarides
                volumes:
                  - 'tarides-deployer-data:/var/lib/ocurrent'
                  - '/var/run/docker.sock:/var/run/docker.sock'
                secrets:
                  - source: tarides-deployer-github-key
                    target: deployer-github-key
                  - source: tarides-deployer-github-oauth
                    target: deployer-github-oauth
                  - source: tarides-deployer-slack
                    target: deployer-slack
                  - source: tarides-deployer-submission-cap
                    target: deployer-submission-cap
                  - source: tarides-deployer-webhook-secret
                    target: deployer-webhook-secret
                  - ocurrentbuilder-password
                  - ocurrent-hub
                  - source: tarides-deployer-ssh-key
                    target: deployer-ssh-key
                    mode: 0400
                sysctls:
                  - 'net.ipv4.tcp_keepalive_time=60'
            volumes:
              prometheus-data:
              grafana-storage:
              caddy_data:
                external: true
              caddy_config:
              mirage-ci_data:
              mirage-deployer-data:
              mirage-deployer-ssh:
              scheduler-data:
                external: true
              scheduler-capnp-secrets:
                external: true
              base-images-data:
                external: true
              base-images-capnp-secrets:
                external: true
              tarides-deployer-data:
                external: true
            secrets:
              mirage-ci-github-token:
                external: true
              mirage-ci-submission-cap:
                external: true
              mirage-ci-webhook-secret:
                external: true
              mirage-deployer-github-key:
                external: true
              mirage-deployer-github-oauth:
                external: true
              mirage-deployer-slack:
                external: true
              mirage-deployer-ssh-key:
                external: true
              mirage-deployer-submission-cap:
                external: true
              mirage-deployer-webhook-secret:
                external: true
              ocurrentbuilder-password:
                external: true
              ocurrent-hub:
                external: true
              base-builder-oauth:
                external: true
              base-builder-slack:
                external: true
              base-builder-submission-cap:
                external: true
              tarides-deployer-github-key:
                external: true
              tarides-deployer-github-oauth:
                external: true
              tarides-deployer-slack:
                external: true
              tarides-deployer-ssh-key:
                external: true
              tarides-deployer-submission-cap:
                external: true
              tarides-deployer-webhook-secret:
                external: true
            networks:
              ocaml-ci_default:
                external: true
              opam-repo-ci_default:
                external: true
  handlers:
    - name: restart prometheus
      shell:
        cmd: PS=$(docker ps --filter=label=com.docker.swarm.service.name=infra_prometheus -q) && if [ -n "$PS" ] ; then docker exec $PS pkill -HUP prometheus ; fi
    - name: restart caddy
      shell:
        cmd: PS=$(docker ps --filter=label=com.docker.swarm.service.name=infra_caddy -q) && if [ -n "$PS" ] ; then docker exec -w /etc/caddy $PS caddy reload ; fi

